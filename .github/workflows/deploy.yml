name: Build and Deploy to ECS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # lets the job request a GitHub OIDC token to exchange for AWS credentials
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false # never cancel a deploy half-way; queue the next one

env:
  AWS_REGION: eu-west-1
  AWS_ROLE_ARN: arn:aws:iam::772297676546:role/myecs-github-app
  ECR_REPOSITORY: myecs-backend
  ECS_CLUSTER: myecs
  ECS_SERVICE: myecs-backend
  TASK_FAMILY: myecs-backend
  CONTAINER_NAME: backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image (skipped if this commit is already in ECR)
        id: image
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/$ECR_REPOSITORY:${GITHUB_SHA::7}"
          # Tags are immutable and named after the commit, so a re-run of the same commit
          # (e.g. "Run workflow" to redeploy) reuses the image that is already in ECR
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "Image $IMAGE already exists, skipping build"
          else
            docker build --provenance=false -t "$IMAGE" .
            docker push "$IMAGE"
          fi
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition --task-definition "$TASK_FAMILY" \
            --query taskDefinition > task-definition.json

      - name: Swap in the new image
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.image.outputs.image }}

      - name: Deploy new task definition
        id: deploy
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          # The action's own waiter backs off exponentially and noticed completion up to ~7 min late
          wait-for-service-stability: false

      # Polls every 15s. One waiter call gives up after 10 min; a failing deploy needs several
      # task attempts plus the rollback, so allow a second round (20 min total).
      - name: Wait for the service to be stable
        run: |
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" ||
            aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"

      # "Stable" is also true after a circuit-breaker rollback (stable on the OLD version),
      # so check that the revision now running is the one this run deployed.
      - name: Verify the new revision is live (not rolled back)
        env:
          EXPECTED: ${{ steps.deploy.outputs.task-definition-arn }}
        run: |
          PRIMARY=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].deployments[?status==`PRIMARY`].[taskDefinition,rolloutState]' --output text)
          echo "Expected: $EXPECTED"
          echo "Running:  $PRIMARY"
          if [[ "$PRIMARY" != "$EXPECTED"$'\t'"COMPLETED" ]]; then
            echo "::error::Deployment did not complete on the new revision - the circuit breaker rolled it back. Check the service events and container logs."
            exit 1
          fi
