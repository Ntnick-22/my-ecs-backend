name: Test, Build and Deploy to ECS

on:
  push:
    branches: [main]
  pull_request: # PRs run the tests only; the deploy job is skipped (see its "if")
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read # default for every job; only deploy gets more

env:
  AWS_REGION: eu-west-1
  AWS_ROLE_ARN: arn:aws:iam::772297676546:role/myecs-github-app
  ECR_REPOSITORY: myecs-backend
  ECS_CLUSTER: myecs
  ECS_SERVICE: myecs-backend
  TASK_FAMILY: myecs-backend
  CONTAINER_NAME: backend

jobs:
  test:
    runs-on: ubuntu-24.04
    # Throwaway Postgres next to the runner, same version as RDS. Published on 5433 so the
    # defaults in tests/conftest.py work unchanged (same as the local docker run).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5433:5432
        # Steps only start once this health check passes ("started" is not "ready")
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12" # same minor version as the python:3.12-slim image
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

  deploy:
    needs: test # a red test means this job never starts: nothing is built, pushed or deployed
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      id-token: write # lets the job request a GitHub OIDC token to exchange for AWS credentials
      contents: read
    concurrency:
      group: deploy-backend
      cancel-in-progress: false # never cancel a deploy half-way; queue the next one
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image (skipped if this commit is already in ECR)
        id: image
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/$ECR_REPOSITORY:${GITHUB_SHA::7}"
          # Tags are immutable and named after the commit, so a re-run of the same commit
          # (e.g. "Run workflow" to redeploy) reuses the image that is already in ECR
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "Image $IMAGE already exists, skipping build"
          else
            docker build --provenance=false -t "$IMAGE" .
            docker push "$IMAGE"
          fi
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition --task-definition "$TASK_FAMILY" \
            --query taskDefinition > task-definition.json

      - name: Swap in the new image
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.image.outputs.image }}

      - name: Deploy new task definition
        id: deploy
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          # The action's own waiter backs off exponentially and noticed completion up to ~7 min late
          wait-for-service-stability: false

      # Follow THIS run's deployment until ECS gives a verdict. "services-stable" isn't enough:
      # it returns while rolloutState is still IN_PROGRESS, and it is also satisfied after a
      # circuit-breaker rollback (stable again, but on the old revision).
      - name: Wait for the deployment to complete (or be rolled back)
        env:
          EXPECTED: ${{ steps.deploy.outputs.task-definition-arn }}
        run: |
          echo "Following deployment of $EXPECTED"
          for i in $(seq 1 80); do # 80 x 15s = 20 min
            STATE=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
              --query "services[0].deployments[?taskDefinition=='$EXPECTED'].rolloutState | [0]" --output text)
            echo "$(date +%T) rolloutState=$STATE"
            case "$STATE" in
              COMPLETED) echo "New revision is live."; exit 0 ;;
              FAILED|None)
                echo "::error::Deployment failed - the circuit breaker rolled it back to the previous revision. Check the service events and container logs."
                aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
                  --query 'services[0].events[:8].message' --output text
                exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::Timed out after 20 min waiting for the deployment"
          exit 1
